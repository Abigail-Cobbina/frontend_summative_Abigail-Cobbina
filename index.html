
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A finance tracker for students to make managing their money easy.">
    <title>Student Finance Tracker</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>

    <header>
        <h1>Student Finance Tracker</h1>
        <p>How to be the sole owner of your pocket.</p>
    </header>

    <main>
        <section aria-labelledby="summary-heading">
            <h2 id="summary-heading">Your Entire Pocket</h2>

            <div class="summary-cards">
                <article>
                    <h3>Total Balance</h3>
                    <p id="balance">RWF 0</p>
                </article>

                <article>
                    <h3>Total Income</h3>
                    <p id="income">RWF 0</p>
                </article>

                <article>
                    <h3>Total Expenses</h3>
                    <p id="expenses">RWF 0</p>
                </article>
            </div>
        </section>

        <section aria-labelledby="transaction-heading">
            <h2 id="transaction-heading">Add a Transaction</h2>

            <form id="transaction-form">
                <label for="description">Description</label>
                <input
                    type="text"
                    id="description"
                    name="description"
                    placeholder="e.g. Lunch"
                    required
                >

                <label for="amount">Amount (RWF)</label>
                <input
                    type="number"
                    id="amount"
                    name="amount"
                    min="1"
                    step="1"
                    required
                >

                <label for="type">Transaction Type</label>
                <select id="type" name="type" required>
                    <option value="income">Income</option>
                    <option value="expense">Expense</option>
                </select>

                <label for="category">Category</label>
                <select id="category" name="category" required>
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Education">Education</option>
                    <option value="Accommodation">Accommodation</option>
                    <option value="Personal">Personal</option>
                    <option value="Other">Other</option>
                </select>

                <label for="date">Date</label>
                <input type="date" id="date" name="date" required>

                <button type="submit">Add Transaction</button>
            </form>
        </section>

        <section aria-labelledby="history-heading">
            <h2 id="history-heading">Transaction History</h2>

            <div id="transaction-list">
                <p>No transactions yet? What are you waiting for?</p>
            </div>
        </section>
    </main>

    <footer>
        <p>Student Finance Tracker &copy; 2026</p>
    </footer>

    <script src="scripts/main.js"></script>
</body>
</html>
